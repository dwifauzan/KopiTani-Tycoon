<!doctype html>
<html lang="id">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KopiTani Tycoon</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-content: center; background: #2b2118; color: #fff8ec; font: 16px system-ui, sans-serif; }
  main { width: min(96vw, 960px); }
  h1 { margin: 0 0 12px; font-size: 1.3rem; }
  form { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  select, button { padding: 8px; font: inherit; }
  img { display: block; width: 100%; aspect-ratio: 16 / 9; background: #e6f4ea; image-rendering: pixelated; cursor: pointer; }
  #status { min-height: 1.5em; }
</style>
<main>
  <h1>KopiTani Tycoon</h1>
  <form id="menu">
    <label for="region">Wilayah dan bulan</label>
    <select id="region"></select>
    <button type="submit">Mulai</button>
  </form>
  <img id="frame" alt="Tampilan permainan kopi; klik petak dan tombol untuk bermain">
  <p>Pilih petak, lalu gunakan tombol di bawah frame. Klik Hari + untuk menumbuhkan tanaman; proses hasil panen sebelum menjualnya.</p>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script>
const frame = document.querySelector('#frame');
const status = document.querySelector('#status');
const region = document.querySelector('#region');
let started = false;
const socket = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
socket.binaryType = 'blob';
fetch('/options').then(r => r.json()).then(options => {
  for (const item of options) {
    const option = document.createElement('option');
    option.value = JSON.stringify(item);
    option.textContent = `${item.region_id} · bulan ${item.month}`;
    region.append(option);
  }
});
socket.onmessage = event => {
  if (event.data instanceof Blob) {
    const previous = frame.src;
    frame.src = URL.createObjectURL(event.data);
    if (previous.startsWith('blob:')) URL.revokeObjectURL(previous);
  } else {
    const message = JSON.parse(event.data);
    if (message.type === 'state') started = true;
    status.textContent = message.type === 'error' ? message.message : `Hari ${message.day} · saldo Rp ${message.balance.toLocaleString('id-ID')}`;
  }
};
socket.onclose = () => { status.textContent = 'Koneksi terputus. Muat ulang halaman.'; };
document.querySelector('#menu').onsubmit = event => {
  event.preventDefault();
  if (socket.readyState !== WebSocket.OPEN || !region.value) return;
  socket.send(JSON.stringify({type: 'start', ...JSON.parse(region.value)}));
};
frame.onclick = event => {
  if (socket.readyState !== WebSocket.OPEN || !started) return;
  const bounds = frame.getBoundingClientRect();
  socket.send(JSON.stringify({type: 'click', x: (event.clientX - bounds.left) * 320 / bounds.width,
    y: (event.clientY - bounds.top) * 180 / bounds.height}));
};
let lastHover = 0;
frame.onmousemove = event => {
  if (!started || socket.readyState !== WebSocket.OPEN || Date.now() - lastHover < 140) return;
  lastHover = Date.now();
  const bounds = frame.getBoundingClientRect();
  socket.send(JSON.stringify({type: 'hover', x: (event.clientX - bounds.left) * 320 / bounds.width,
    y: (event.clientY - bounds.top) * 180 / bounds.height}));
};
</script>
</html>
